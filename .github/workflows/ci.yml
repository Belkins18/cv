name: CI

on:
  push:
    branches: [master, development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The pnpm version comes from `packageManager` in package.json — there is
      # no need to duplicate it here or in netlify.toml.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium is needed twice: by the pdf step the site build depends on, and
      # by e2e. Playwright is declared in @cv/web; there is no binary at the root.
      - run: pnpm --filter @cv/web exec playwright install --with-deps chromium

      # Eight gates — exactly the local ones, in the same order.
      # The guard goes first: running the rest on top of a leak makes no sense.
      - run: pnpm guard
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Builds both the PDF and the site: @cv/web#build depends on @cv/print#pdf.
      # Two gates live inside the build: copy-pdf reads the PDF's text layer,
      # scan-dist reads the built bundle.
      - run: pnpm build
      # The 19 ATS checks over the built PDF: text layer, two pages, keywords.
      # They live in a separate vitest config, and `pnpm test` does NOT pick them
      # up — without this line Review Focus #1 would be the one class of failure
      # with no automated gate, while CI publishes that unchecked PDF as an
      # artifact and Netlify puts it behind the Download button.
      - run: pnpm pdf
      - run: pnpm --filter @cv/web e2e

      # The PDF is built WITHOUT CV_PHONE: the number is injected only by the
      # local build of the file that goes out with an application (design doc §10).
      # The artifact exists so the resume layout can be looked at without
      # building it locally.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-pdf
          path: out/cv-nikolay-belibov.pdf
          if-no-files-found: warn

      # Traces from retried e2e runs: on a CI failure this is the only way to
      # see what was on the page.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
