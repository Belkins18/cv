<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NB">
  <!--
    SVG, а не PNG: .gitignore запрещает *.png и *.jpg на весь репозиторий ради
    защиты от скриншотов, и обходить этот запрет исключением ради иконки незачем.
    Цвет — акцент темы в hex, а не oklch: фавиконку рендерит не всегда полноценный
    движок, и ошибаться она будет невидимо.
  -->
  <rect width="64" height="64" rx="14" fill="#0d8a73" />
  <text
    x="32"
    y="44"
    text-anchor="middle"
    font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="32"
    font-weight="700"
    fill="#ffffff"
  >NB</text>
</svg>
